<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste das ilustrações v2</title>
<style>
  body{ margin:0; padding:32px; background:#F6F8FC;
        font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; }
  .par{ display:grid; grid-template-columns:1fr 1fr; gap:28px; max-width:900px; margin:0 auto; }
  .card{ background:#fff; border:1px solid #E5E9F0; border-radius:22px; overflow:hidden;
         box-shadow:0 4px 16px rgba(15,23,42,.07); }
  .art svg{ display:block; width:100%; height:auto; }
  .art-azul{ background:linear-gradient(160deg,#F8FAFF,#EAF2FF); }
  .art-violeta{ background:linear-gradient(160deg,#FCFAFF,#F3EFFF); }
  .corpo{ padding:22px 26px 28px; }
  .tag{ display:inline-block; font-size:.73rem; font-weight:800; letter-spacing:.08em;
        text-transform:uppercase; padding:5px 12px; border-radius:100px; margin-bottom:12px; }
  .tag-azul{ color:#2563EB; background:#EFF6FF; border:1px solid rgba(37,99,235,.16); }
  .tag-violeta{ color:#7C3AED; background:#F5F3FF; border:1px solid rgba(124,58,237,.16); }
  h3{ margin:0 0 8px; font-size:1.15rem; color:#0F172A; }
  p{ margin:0; font-size:.9rem; color:#4B5563; line-height:1.6; }
</style>
</head>
<body>
<div class="par">

  <!-- ===================== DOMINIO: rua com placa de endereco ===================== -->
  <div class="card">
    <div class="art art-azul">
      <svg viewBox="0 0 320 148" xmlns="http://www.w3.org/2000/svg">
        <!-- casas da rua -->
        <g fill="#B9D0F0">
          <path d="M14 116V88l25-17 25 17v28Z"/>
          <path d="M210 116V84l24-16 24 16v32Z"/>
        </g>
        <g fill="#9CBDE8">
          <path d="M64 116V92l21-14 21 14v24Z"/>
          <path d="M258 116V94l20-13 20 13v22Z"/>
        </g>
        <!-- janelas -->
        <g fill="#EAF2FD">
          <rect x="27" y="96" width="9" height="9" rx="2"/>
          <rect x="42" y="96" width="9" height="9" rx="2"/>
          <rect x="75" y="100" width="8" height="8" rx="2"/>
          <rect x="88" y="100" width="8" height="8" rx="2"/>
          <rect x="223" y="94" width="9" height="9" rx="2"/>
          <rect x="238" y="94" width="9" height="9" rx="2"/>
          <rect x="268" y="102" width="8" height="8" rx="2"/>
          <rect x="280" y="102" width="8" height="8" rx="2"/>
        </g>
        <!-- poste da placa -->
        <rect x="155" y="50" width="9" height="66" rx="4.5" fill="#0F172A"/>
        <rect x="147" y="110" width="25" height="7" rx="3.5" fill="#0F172A"/>
        <!-- placa com o dominio -->
        <rect x="74" y="4" width="172" height="47" rx="13" fill="#2563EB"/>
        <text x="160" y="34" text-anchor="middle"
              font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif"
              font-size="15" font-weight="700" fill="#FFFFFF">suaempresa.com.br</text>
        <!-- calcada -->
        <rect x="0" y="116" width="320" height="8" fill="#D9E5F8"/>
        <!-- rua -->
        <rect x="0" y="124" width="320" height="24" fill="#E8EFFB"/>
        <g fill="#FFFFFF">
          <rect x="16" y="134" width="30" height="3.5" rx="1.75"/>
          <rect x="66" y="134" width="30" height="3.5" rx="1.75"/>
          <rect x="116" y="134" width="30" height="3.5" rx="1.75"/>
          <rect x="166" y="134" width="30" height="3.5" rx="1.75"/>
          <rect x="216" y="134" width="30" height="3.5" rx="1.75"/>
          <rect x="266" y="134" width="30" height="3.5" rx="1.75"/>
        </g>
      </svg>
    </div>
    <div class="corpo">
      <span class="tag tag-azul">Domínio</span>
      <h3>O endereço do seu site</h3>
      <p>É o nome que as pessoas digitam para chegar até você: <b>suaempresa.com.br</b>.</p>
    </div>
  </div>

  <!-- ===================== HOSPEDAGEM: terreno com servidor dentro ===================== -->
  <div class="card">
    <div class="art art-violeta">
      <svg viewBox="0 0 320 148" xmlns="http://www.w3.org/2000/svg">
        <!-- casa -->
        <path d="M160 16 100 60h120Z" fill="#7C3AED"/>
        <rect x="120" y="60" width="80" height="52" rx="4" fill="#0F172A"/>
        <rect x="152" y="80" width="18" height="32" rx="2" fill="#F5F3FF"/>
        <rect x="129" y="70" width="15" height="14" rx="2" fill="#D8C9FA"/>
        <rect x="176" y="70" width="15" height="14" rx="2" fill="#D8C9FA"/>
        <!-- superficie do terreno -->
        <rect x="0" y="112" width="320" height="5" fill="#CFC6E8"/>
        <!-- bloco de terra -->
        <path d="M38 117h244v8a16 16 0 0 1-16 16H54a16 16 0 0 1-16-16Z" fill="#E4DDF3"/>
        <!-- pontinhos de terra -->
        <g fill="#C9BFE2">
          <circle cx="70" cy="128" r="3"/><circle cx="96" cy="136" r="2.5"/>
          <circle cx="246" cy="127" r="3"/><circle cx="266" cy="136" r="2.5"/>
          <circle cx="120" cy="140" r="2"/><circle cx="206" cy="139" r="2"/>
          <circle cx="84" cy="141" r="2"/><circle cx="252" cy="141" r="2"/>
          <circle cx="60" cy="132" r="2"/><circle cx="278" cy="130" r="2"/>
        </g>
        <!-- servidor guardando o site -->
        <rect x="136" y="120" width="48" height="24" rx="6" fill="#0F172A"/>
        <g fill="#8B5CF6">
          <rect x="143" y="125" width="34" height="3.5" rx="1.75"/>
          <rect x="143" y="131" width="34" height="3.5" rx="1.75"/>
        </g>
        <circle cx="179" cy="138" r="2.6" fill="#4ADE80"/>
      </svg>
    </div>
    <div class="corpo">
      <span class="tag tag-violeta">Hospedagem</span>
      <h3>O terreno onde o site fica</h3>
      <p>É o computador ligado 24h que guarda os arquivos e os entrega para quem acessa.</p>
    </div>
  </div>

</div>
</body>
</html>
